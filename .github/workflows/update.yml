name: Update chart data

on:
  schedule:
    - cron: "*/15 * * * *"   # har 15 minute mein
  workflow_dispatch:          # haath se "Run workflow" dabane ke liye

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch data from Notion
        run: node fetch_notion.mjs
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}

      - name: Save data.json
        run: |
          git config user.name "chart-bot"
          git config user.email "chart-bot@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || (git commit -m "Update chart data" && git push)
